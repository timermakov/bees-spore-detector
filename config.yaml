# ========== OpenCV Configuration ==========
# Path to images folder.
data_dir: bees_dataset#3_2025-08-22_tiles
# Folder for results (.md, debug images, Excel report)
results_dir: bees_dataset#3_2025-08-22_tiles

# Processing parameters (see bees/image_proc.py for detection details)
# Min/max area of elliptical potential contour (pixels)
min_contour_area: 45
max_contour_area: 650
# Min/max area of confirmed ellipse (pixels)
min_ellipse_area: 100
max_ellipse_area: 360
# Canny algorithm threshold values
canny_threshold1: 40
canny_threshold2: 120
# Minimum contour length (number of points) for ellipse
min_spore_contour_length: 7
# Intensity threshold: how much average brightness inside ellipse can differ from background
intensity_threshold: 36

# Analysis zone parameters (green square)
# Square size in pixels
analysis_square_size: 780
# Volume coefficient for titer calculation (million spores/ml)
# Formula: titer = N_spores_on_photo / (volume_factor * (S_photo / S_analysis_square²) * N_photos)
volume_factor: 4.0
# Square line width in pixels (to see square on UI for user)
analysis_square_line_width: 2

# ========== YOLO Configuration ==========
yolo_datasets_root: dataset_train
yolo_dataset_folder_pattern: "*"
# Annotation source for training: auto, xml, or coco.
yolo_annotations_format: auto
# Unified shortcuts for auto-discovery:
# Optional fixed relative path to annotation file inside each portion.
yolo_annotations_relpath: null
# Images root inside each portion.
yolo_images_subdir: .
yolo_image_extensions: [".jpg", ".jpeg", ".png", ".bmp", ".tif", ".tiff", ".webp"]
yolo_test_dir: dataset_test
yolo_output_dir: yolo_dataset
yolo_models_dir: models
yolo_class_names: [spore]

# Use this structure for incremental retraining:
# dataset_train/portion_001/...images... + annotation XML
# dataset_train/portion_002/...images... + annotation XML
# dataset_train/portion_003/...images... + annotation XML
#
# Current COCO example:
# yolo_datasets_root: dataset_train
# yolo_dataset_folder_pattern: dataset_train_2026-27-05
# yolo_annotations_format: auto
# yolo_annotations_relpath: sliced/coco_annotations.json_coco.json
# yolo_images_subdir: sliced/images

# Pretrained model. Change this value (for example to yolo26s.pt) to train
# and load a model family without changing Python code.
yolo_model: yolo11s.pt
# Detection confidence threshold [0-1]
yolo_confidence: 0.25
# IoU threshold for NMS [0-1]
yolo_iou_threshold: 0.45
# Number of training epochs
yolo_epochs: 100
# Batch size (decrease if out of memory)
yolo_batch_size: 2
# Image size for training/inference (larger = more accurate but slower)
yolo_imgsz: 960
# Stop after this many epochs without validation improvement.
yolo_patience: 25
# DataLoader workers. Use 0 if multiprocessing causes issues on a host.
yolo_workers: 2
# null auto-selects a CUDA device when available; use "cpu" or "0" to override.
yolo_device: null

# Quick-test profile used by --quick-test.
yolo_quick_test_epochs: 30
yolo_quick_test_imgsz: 1024
yolo_quick_test_batch_size: 8
yolo_quick_test_patience: 0
# Dataset split used for training and validation.
yolo_validation_split: 0.4
yolo_split_seed: 42

# Training augmentations and optimizer.
yolo_mosaic: 1.0
yolo_mixup: 0.15
yolo_hsv_h: 0.015
yolo_hsv_s: 0.7
yolo_hsv_v: 0.4
yolo_degrees: 15.0
yolo_scale: 0.3
yolo_fliplr: 0.5
yolo_flipud: 0.5
yolo_optimizer: AdamW
yolo_learning_rate: 0.0005
yolo_final_learning_rate_factor: 0.01
yolo_warmup_epochs: 2
yolo_copy_paste: 0.3
yolo_cache: false
yolo_amp: true
yolo_show_labels: false
yolo_show_conf: false
yolo_pretrained: true
yolo_verbose: true

# ========== Tiley / SAHI (YAML-first) ==========
# Commands:
#   python -m bees.main tile-export [--input ...] [--out ...]
#   python -m bees.main tile-predict [--input ...] [--out ...]
# All quality/inference parameters are taken from YAML only.
tiley:
  export:
    # Folder with source images (can override via tile-export --input)
    input: sahi_tiled_export
    # Path to CVAT XML; if null, will try to use <input>/annotations.xml
    cvat_xml: null
    # Result folder (can override via tile-export --out)
    out: sahi_tiled_export
    # Square tile: tile_size x tile_size
    tile_size: 480
    overlap_height_ratio: 0.2
    overlap_width_ratio: 0.2

  predict:
    # Folder with images for inference (can override via tile-predict --input)
    input: dataset_test
    # Result folder (can override via tile-predict --out)
    out: results/sahi_tiled_predictions
    # Square tile: tile_size x tile_size
    tile_size: 480
    overlap_height_ratio: 0.06
    overlap_width_ratio: 0.054
    conf: 0.25
    write_previews: true
    # null = trained checkpoint for yolo_model:
    # <yolo_models_dir>/<model stem>_spores/weights/best.pt
    # Set a path to pin a different checkpoint.
    weights: null
    device: cuda:0
    model_type: ultralytics
